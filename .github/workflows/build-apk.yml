name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Prepare python-for-android
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android.git python-for-android

          python - <<'PY'
          from pathlib import Path

          path = Path("python-for-android/pythonforandroid/build.py")
          text = path.read_text()

          old = "shprint(host_python, '-m', 'venv', 'venv')"
          new = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected python-for-android venv line was not found."
              )

          path.write_text(text.replace(old, new, 1))
          print("python-for-android patched successfully.")
          PY

          grep -n "venv.*--clear" python-for-android/pythonforandroid/build.py

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telecom-Site-Manager-APK
          path: bin/*.apk
          if-no-files-found: error
